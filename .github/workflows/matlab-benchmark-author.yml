name: MATLAB score benchmark author-weight predictions

# Other pansharpening models are inferred elsewhere (server or Kaggle; CUDA-only models such as CANNet on Kaggle). Their saved
# RR predictions (author weights or our own retrain) are kept as a GitHub Release asset and scored here with the actual DLPan
# MATLAB functions (same score_suite.m as experiments 53/54). Asset name: <model>_<setting>_<SENSOR>_rr.zip.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Benchmark model folder (SSA-MRN/benchmarks/<model>)
        default: cannet
      setting:
        description: author (published weights) or retrain (trained on our data)
        default: author
      release:
        description: Release tag holding <model>_<setting>_<SENSOR>_rr.zip
        default: predictions-benchmarks-cannet-author
      sensors:
        description: JSON list of sensors to score
        default: '["QB","GF2","WV3","WV2"]'
      key:
        description: Variable name of the prediction in each .mat
        default: sr
      bands:
        description: all (every band) or rgb (R,G,B only, for 3-band generative image model predictions)
        default: all
  push:
    branches: [cannet-author-reproduction]
    paths:
      - .github/workflows/matlab-benchmark-author.yml
      - SSA-MRN/common/matlab_reevaluation/benchmark_*.py

permissions:
  contents: read

concurrency:
  group: matlab-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  score:
    name: ${{ matrix.sensor }} / ${{ inputs.setting || 'author' }} / ${{ inputs.bands || 'all' }} bands / actual MATLAB
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sensor: ${{ fromJSON(inputs.sensors || '["QB","GF2","WV3","WV2"]') }}
    env:
      MODEL: ${{ inputs.model || 'cannet' }}
      SETTING: ${{ inputs.setting || 'author' }}
      KEY: ${{ inputs.key || 'sr' }}
      BANDS: ${{ inputs.bands || 'all' }}
      RELEASE: ${{ inputs.release || 'predictions-benchmarks-cannet-author' }}
      SENSOR: ${{ matrix.sensor }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /SSA-MRN/common/
            /SSA-MRN/experiments/performance/53_scale_mixed_training/config.json
            /SSA-MRN/experiments/performance/54_multi_sensor_scale_mixed_training/config.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pinned dependencies (no torch, no inference)
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 h5py==3.14.0 scikit-image==0.25.2
      - name: Download the saved predictions
        run: |
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "${MODEL}_${SETTING}_${SENSOR}_rr.zip" --dir pred
          sha256sum pred/*.zip
          unzip -q "pred/${MODEL}_${SETTING}_${SENSOR}_rr.zip" -d "pred/${SENSOR}"
      - name: Check the exact test data and write MATLAB inputs
        run: python SSA-MRN/common/matlab_reevaluation/benchmark_prepare.py --model "$MODEL" --setting "$SETTING" --sensor "$SENSOR" --key "$KEY" --bands "$BANDS" --predictions "pred/$SENSOR" --data "$RUNNER_TEMP/pancollection" --out evaluation
      - name: Checkout original DLPan MATLAB sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: liangjiandeng/DLPan-Toolbox
          ref: a34f884af88967580e3ef4f61a89e12fdfe4cda5
          path: dlpan
          sparse-checkout: |
            02-Test-toolbox-for-traditional-and-DL(Matlab)/Quality_Indices
            02-Test-toolbox-for-traditional-and-DL(Matlab)/Tools
      - name: Verify DLPan version and source hashes
        run: |
          test "$(git -C dlpan rev-parse HEAD)" = a34f884af88967580e3ef4f61a89e12fdfe4cda5
          find dlpan -type f -name '*.m' -print0 | sort -z | xargs -0 sha256sum > evaluation/dlpan_sources.sha256
      - name: Set up actual MATLAB and Image Processing Toolbox
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2025b
          products: Image_Processing_Toolbox
      - name: Score the predictions with actual MATLAB (no crop, no clipping, as in the CtrS evaluation)
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath(fullfile(pwd,'SSA-MRN','common','matlab_reevaluation')); score_suite(fullfile(pwd,'evaluation'),fullfile(pwd,'dlpan','02-Test-toolbox-for-traditional-and-DL(Matlab)'),false,21,false)
      - name: Compare MATLAB and Python on the same arrays
        run: python SSA-MRN/common/matlab_reevaluation/benchmark_report.py case --out evaluation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: matlab-${{ env.MODEL }}-${{ env.SETTING }}-${{ matrix.sensor }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            evaluation/*.json
            evaluation/*.sha256

  summary:
    needs: score
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: SSA-MRN/common/matlab_reevaluation
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: matlab-*-*-*
          path: case-results
      - name: MATLAB summary table
        run: python SSA-MRN/common/matlab_reevaluation/benchmark_report.py aggregate --input case-results --out summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matlab-benchmark-${{ inputs.model || 'cannet' }}-${{ inputs.setting || 'author' }}-summary
          path: summary/
          retention-days: 30
          if-no-files-found: error
