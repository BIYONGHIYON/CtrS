<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팬샤프닝 결과 비교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0; --ink: #1b1a17; --ink-2: #55524c; --ink-3: #6f6b63; --rule: #dad7ce; --rule-2: #b9b5aa; --fill: #eae8e1;
  --sel: #ffd200; --up: #1a5fb4; --down: #b3410e; --mat: #0e0e0d;
  --sans: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151413; --ink: #edebe6; --ink-2: #b8b4ac; --ink-3: #96928a; --rule: #2e2c29; --rule-2: #4c4944; --fill: #22201e;
    --up: #7db4ff; --down: #ff9166;
  }
}
:root[data-theme="dark"] {
  --bg: #151413; --ink: #edebe6; --ink-2: #b8b4ac; --ink-3: #96928a; --rule: #2e2c29; --rule-2: #4c4944; --fill: #22201e;
  --up: #7db4ff; --down: #ff9166;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1600px; margin: 0 auto; padding: 0 20px; }

/* header */
.top { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid var(--rule-2); }
.top-in { display: flex; align-items: stretch; gap: 28px; min-height: 46px; }
.brand { display: flex; align-items: baseline; gap: 10px; align-self: center; white-space: nowrap; }
.brand strong { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { font: 12px var(--mono); color: var(--ink-3); }
.tabs { display: flex; gap: 22px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-top: 2px solid transparent; padding: 0 1px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.top .theme { margin-left: auto; align-self: center; background: none; border: 0; padding: 4px 0; color: var(--ink-3); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.top .theme:hover { color: var(--ink); }

main { padding-top: 12px; padding-bottom: 48px; }
.ds-note { margin: 0 0 12px; color: var(--ink-2); font-size: 13px; }
.ds-note b { font-weight: 600; color: var(--ink); margin-right: 8px; }

/* scene strip */
.strip-head { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; color: var(--ink-3); margin-bottom: 5px; }
.strip-head span:first-child { white-space: nowrap; }
.strip-head span:last-child { text-align: right; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(40px, 1fr); gap: 6px; overflow-x: auto; padding: 4px 4px 8px; margin: 0 -4px; scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
.shot { background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; }
.shot .th { position: relative; aspect-ratio: 1; background-color: var(--fill); background-repeat: no-repeat; background-size: calc(var(--n) * 100%) 100%; background-position: calc(var(--i) / (var(--n) - 1) * 100%) 0; }
.shot:hover .th { box-shadow: 0 0 0 1px var(--rule-2); }
.shot[aria-current="true"] .th { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.shot .no { position: absolute; left: 0; top: 0; font: 500 11px/16px var(--mono); padding: 0 5px; background: rgba(0, 0, 0, .62); color: #fff; }
.shot .no.std { box-shadow: inset 0 -2px 0 #fff; }
.shot[aria-current="true"] .no { background: var(--sel); color: #000; box-shadow: none; }
.shot .dv { font: 11px var(--mono); letter-spacing: -0.02em; color: var(--ink-2); padding-left: 1px; white-space: nowrap; }

/* toolbar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; padding: 9px 0; margin-top: 8px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.scene-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin-right: 4px; white-space: nowrap; }
.scene-title span { font-size: 13px; font-weight: 400; color: var(--ink-2); margin-left: 8px; }
.group { display: inline-flex; align-items: center; gap: 8px; }
.group > .lab { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.spacer { flex: 1 1 0; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.check input { accent-color: var(--ink); margin: 0; width: 14px; height: 14px; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 4px; overflow: hidden; }
.seg button { background: none; border: 0; border-left: 1px solid var(--rule-2); padding: 3px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--fill); }
.seg button[aria-pressed="true"], .seg button[aria-pressed="true"]:hover { background: var(--ink); color: var(--bg); font-weight: 600; }
.btn, .pop > summary { border: 1px solid var(--rule-2); border-radius: 4px; background: none; padding: 3px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover, .pop > summary:hover { background: var(--fill); }
.pop { position: relative; }
.pop > summary { list-style: none; user-select: none; }
.pop > summary::-webkit-details-marker { display: none; }
.pop[open] > summary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pop-body { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 330px; background: var(--bg); border: 1px solid var(--rule-2); border-radius: 4px; padding: 12px 14px; box-shadow: 0 10px 28px rgba(0, 0, 0, .22); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px 12px; align-items: center; font-size: 13px; }
.pop-body .lab { color: var(--ink-2); white-space: nowrap; }
.pop-body select, .pop-body input[type=number] { width: 100%; height: 28px; background: var(--bg); border: 1px solid var(--rule-2); border-radius: 4px; padding: 0 6px; }
.pop-body .pair { display: flex; gap: 6px; }

/* layers */
.layers { display: grid; grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr)); gap: 16px 10px; margin-top: 14px; max-width: calc(var(--cols, 6) * 340px); }
.layer { min-width: 0; container-type: inline-size; }
.layer h3 { margin: 0 0 3px; font-size: 13.5px; font-weight: 600; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; }
.layer h3 small { font-size: 12px; font-weight: 400; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--rule-2); border-radius: 3px; padding: 0 5px; line-height: 16px; }
.frame { position: relative; aspect-ratio: 1; background: var(--mat); border: 2px solid transparent; overflow: hidden; touch-action: none; }
.frame.full { cursor: crosshair; border-color: var(--mat); }
.frame.zoom { border-color: var(--sel); }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.frame.zoom canvas { image-rendering: pixelated; }
.box { position: absolute; border: 1.5px solid var(--sel); box-shadow: 0 0 0 1px rgba(0, 0, 0, .65); pointer-events: none; }
.vl, .hl { position: absolute; background: #fff; mix-blend-mode: difference; pointer-events: none; display: none; }
.vl { width: 1px; top: 0; bottom: 0; } .hl { height: 1px; left: 0; right: 0; }
.cap { display: flex; justify-content: space-between; gap: 8px; min-height: 22px; padding: 3px 2px 0; font: 12px/18px var(--mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.cap.first { margin-bottom: 8px; }
.cap b { font-weight: 500; color: var(--ink); }
.scale { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-3); }
.scale i { display: inline-block; width: 30px; height: 7px; }
@container (max-width: 175px) { .scale i { width: 14px; } }
.scale i.heat { background: linear-gradient(90deg, #000, #7f0000 33%, #ff7f00 67%, #fff); }
.scale i.div { background: linear-gradient(90deg, rgb(255, 104, 56), #000 50%, rgb(70, 160, 255)); }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-3); }

.hint { margin: 12px 0 0; font-size: 12px; color: var(--ink-3); }
#readout { margin-top: 2px; min-height: 18px; font: 12px/18px var(--mono); color: var(--ink-2); white-space: pre-wrap; }

/* numbers */
.scroll { overflow-x: auto; }
table.numbers { border-collapse: collapse; width: 100%; margin-top: 16px; border-top: 1px solid var(--rule-2); }
.numbers th, .numbers td { padding: 6px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
.numbers th { font-size: 12px; font-weight: 500; color: var(--ink-3); }
.numbers tr.groups th { text-align: left; color: var(--ink); font-size: 12.5px; font-weight: 600; padding-top: 9px; border-bottom: 0; }
.numbers th:first-child, .numbers td:first-child { text-align: left; padding-left: 2px; }
.numbers td { font: 13px var(--mono); vertical-align: top; }
.numbers td:first-child { font: 600 13.5px var(--sans); }
.numbers .g { border-left: 1px solid var(--rule); }
.numbers .d { display: block; font-size: 11.5px; }

/* about */
.about { margin-top: 26px; border-top: 1px solid var(--rule); }
.about > summary { cursor: pointer; padding: 10px 0; font-size: 13px; color: var(--ink-2); }
.about > summary:hover { color: var(--ink); }
.about dl { margin: 0 0 14px; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 20px; font-size: 13px; }
.about dt { font-weight: 600; }
.about dd { margin: 0; color: var(--ink-2); }
.about code { font: 11.5px var(--mono); color: var(--ink-3); word-break: break-all; }
.about ul { margin: 0 0 8px; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
.about li { margin: 3px 0; }

.empty { padding: 56px 0; color: var(--ink-2); }
.empty code { font: 12.5px var(--mono); background: var(--fill); padding: 2px 6px; border-radius: 3px; color: var(--ink); }
#loading { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 5px 12px; border-radius: 4px; font-size: 12.5px; display: none; }

@media (max-width: 720px) {
  .wrap { padding: 0 16px; }
  .top-in { flex-wrap: wrap; gap: 0 20px; }
  .tabs button { padding: 9px 1px; }
  .strip { grid-auto-columns: 62px; }
  .spacer { display: none; }
  .pop-body { right: auto; left: 0; width: min(330px, calc(100vw - 32px)); }
  .about dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .about dd { margin-bottom: 8px; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <div class="brand"><strong>팬샤프닝 결과 비교</strong><span>RR test · seed 42</span></div>
  <nav class="tabs" id="dsTabs" aria-label="데이터셋"></nav>
  <button class="theme" id="theme" type="button"></button>
</div></header>
<main class="wrap" id="app"><p class="empty">불러오는 중</p></main>
<div id="loading">장면 불러오는 중</div>
<script src="app.js"></script>
</body>
</html>
